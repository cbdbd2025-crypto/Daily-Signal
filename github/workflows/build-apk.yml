name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIPFILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Found zip: $ZIPFILE"
          unzip -o "$ZIPFILE" -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: extracted/ConfirmSignalApp
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: mv extracted/ConfirmSignalApp/app/build/outputs/apk/debug/app-debug.apk extracted/ConfirmSignalApp/app/build/outputs/apk/debug/Daily-Signal.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Signal
          path: extracted/ConfirmSignalApp/app/build/outputs/apk/debug/Daily-Signal.apk
